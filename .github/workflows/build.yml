name: Build APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build debug APK
        run: |
          mkdir -p app
          cat > settings.gradle <<'EOF2'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "ElectricPlan"
          include ':app'
          EOF2
          cat > build.gradle <<'EOF2'
          plugins {
              id 'com.android.application' version '8.5.2' apply false
          }
          EOF2
          cat > gradle.properties <<'EOF2'
          org.gradle.jvmargs=-Xmx2g -Dfile.encoding=UTF-8
          android.useAndroidX=true
          android.nonTransitiveRClass=true
          EOF2
          cat > app/build.gradle <<'EOF2'
          plugins {
              id 'com.android.application'
          }
          android {
              namespace 'com.tbbg.electricplan'
              compileSdk 34
              defaultConfig {
                  applicationId "com.tbbg.electricplan"
                  minSdk 24
                  targetSdk 34
                  versionCode 2
                  versionName "1.1"
              }
              buildTypes {
                  release {
                      minifyEnabled false
                  }
              }
              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
          }
          dependencies {
              implementation 'androidx.webkit:webkit:1.11.0'
              implementation 'androidx.core:core:1.12.0'
          }
          EOF2
          gradle :app:assembleDebug --no-daemon || { echo "=== ФАЙЛЫ В РЕПОЗИТОРИИ ==="; find . -type f -not -path './.git/*' -not -path './app/build/*' -not -path './.gradle/*' | sort; exit 1; }

      - uses: actions/upload-artifact@v4
        with:
          name: ElectricPlan-APK
          path: app/build/outputs/apk/debug/*.apk
