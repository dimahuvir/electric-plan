name: Build APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Показать файлы проекта
        run: |
          find . -type f -not -path './.git/*' | sort
          echo "=== app/build.gradle ==="
          head -5 app/build.gradle || echo "ФАЙЛА app/build.gradle НЕТ"
          echo "=== build.gradle в корне ==="
          head -5 build.gradle || echo "ФАЙЛА build.gradle НЕТ"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build debug APK
        run: gradle :app:assembleDebug --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: ElectricPlan-APK
          path: app/build/outputs/apk/debug/*.apk
