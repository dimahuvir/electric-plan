<!DOCTYPE html>
<html lang="ru"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>План электрика</title>
<style>
:root{--bg:#f3f1ea;--ink:#1d2a5c;--line:#b9b4a3;--card:#fffdf6;--acc:#2a3f9e;--sub:#5a6180;--red:#e53935;color-scheme:light}

*{box-sizing:border-box}

button{cursor:pointer;font-weight:bold}
button.on{background:var(--ink);color:var(--bg)}
button.go{background:var(--acc);color:#fff;border-color:var(--acc)}
button.danger{border-color:var(--red);color:var(--red)}
#top{display:flex;gap:6px;align-items:center;padding:6px 8px;background:var(--card);border-bottom:2px solid var(--ink)}
#top .grow{flex:1}
#top .sv{font-size:11px;color:var(--sub)}
#mid{position:relative;flex:1;min-height:0}
#stage{position:absolute;inset:0;perspective:2600px;overflow:hidden;touch-action:none;
background-color:var(--bg);background-image:repeating-linear-gradient(0deg,transparent 0 23px,var(--line) 23px 24px),repeating-linear-gradient(90deg,transparent 0 23px,var(--line) 23px 24px)}
#world{position:absolute;left:50%;top:50%;transform-style:preserve-3d}
.wall{position:absolute;left:0;top:0;transform-origin:0 0;background:rgba(42,63,158,.12);border:2px solid var(--acc);transform-style:preserve-3d;color:var(--ink)}
.wall svg{position:absolute;left:0;top:0;pointer-events:none;overflow:visible}
.zb{position:absolute;right:8px;top:50%;font-size:30px;opacity:.22;pointer-events:none}
.wn{position:absolute;left:4px;top:3px;background:var(--ink);color:var(--bg);font:bold 12px/1 sans-serif;padding:3px 6px;border-radius:6px;pointer-events:none;transform:translateZ(1px)}
.floor{position:absolute;left:0;top:0;transform-origin:0 0;pointer-events:none;background-color:rgba(130,140,160,.14);background-image:linear-gradient(rgba(120,130,150,.3) 1px,transparent 1px),linear-gradient(90deg,rgba(120,130,150,.3) 1px,transparent 1px)}

.bx.sel{outline:3px solid #ffd400;outline-offset:2px}

.bx .pb{position:absolute;top:-11px;right:-12px;background:#000;color:#fff;font:bold 10px/13px sans-serif;border-radius:7px;padding:0 4px;font-style:normal}

.jb.rd{border-radius:50%;background:#fff}
.jb.sel{outline:3px solid #ffd400;outline-offset:2px}
.pn{position:absolute;background:#444;border:1.5px solid #fff;color:#fff;font-weight:bold;text-align:center;transform:translateZ(2px)}
.pn.sel{outline:3px solid #ffd400;outline-offset:2px}
.pn.off{background:transparent;border:2px dashed var(--ink);color:var(--ink)}
#zoom{position:absolute;left:8px;top:8px;display:flex;flex-direction:column;gap:6px}
.rail,#zoom,#legend,#empty{transition:opacity .12s}

#zoom button{width:44px;height:44px;font-size:22px;padding:0}

.rail>*{pointer-events:auto}
#lrail{left:0;width:64px}

.rl{font-size:10px;color:var(--sub);text-align:center;text-shadow:0 0 3px var(--bg);pointer-events:none}
.wb{height:54px;font-size:21px}
.tbn{height:56px;border-bottom:6px solid var(--c)!important;font-size:20px}
.ct{height:44px;font-size:17px}

.chips .wi{flex:none;align-self:center}
.dots{display:flex;gap:2px}.dots i{width:13px;height:13px;border-radius:3px;border:1px solid #000;display:inline-block}
#pop{position:fixed;inset:0;z-index:50;pointer-events:none}

.wh2 b{flex:1;font-size:16px}
.x{width:36px;height:36px;padding:0!important;border-radius:50%!important;background:var(--red)!important;border:2px solid #fff!important;color:#fff!important;font-size:18px;line-height:1;box-shadow:0 1px 4px rgba(0,0,0,.4)}
.tabs{display:flex;gap:5px;padding:6px 8px;overflow-x:auto;border-bottom:1px solid var(--line)}
.tabs button{white-space:nowrap;padding:6px 11px}
.pc{overflow:auto;padding:6px 12px 16px;flex:1}
.row{display:flex;gap:6px;flex-wrap:wrap;align-items:flex-end;margin:6px 0}

.row input[type=number]{width:92px}
.sec{background:var(--card);border:1.5px solid var(--line);border-radius:8px;padding:8px;margin:8px 0}
.st{font-weight:bold;margin-bottom:4px}
.q{font-weight:bold;margin:10px 0 2px}
.hint{font-size:13px;color:var(--sub);margin:2px 0 4px}
.big{font-size:20px;min-width:80px;text-align:center}
.stp{align-items:center!important}
.seg{display:flex;margin:4px 0}
.seg button{flex:1;border-radius:0;font-weight:normal;padding:9px 3px;font-size:14px}
.seg button:first-child{border-radius:8px 0 0 8px}.seg button:last-child{border-radius:0 8px 8px 0}
.seg button.on{font-weight:bold}
.seg button.tb{border-bottom:6px solid var(--c);font-size:12px;padding:6px 2px;display:flex;flex-direction:column;align-items:center;gap:2px}
body.hs .rail{display:none}
table{width:100%;border-collapse:collapse;background:var(--card);font-size:14px;margin:4px 0}
td,th{border:1px solid var(--line);padding:4px 6px;text-align:left;vertical-align:top}
.sw{display:inline-block;width:14px;height:14px;border-radius:50%;border:1px solid #000;vertical-align:middle;margin-right:6px}
.note{font-size:12px;color:var(--sub)}
ol.tl{margin:4px 0 0;padding-left:20px;font-size:13px}
.rvs{display:flex;flex-wrap:wrap;gap:10px}.rv{flex:1 1 210px}
.rv svg,.jbw svg{display:block;margin:0 auto;width:100%;max-width:300px}
.pv{background:#e8b100;border:1.5px solid #000;margin:6px 0;display:flex;align-items:center;justify-content:center;font:bold 11px sans-serif;color:#000}
textarea{width:100%;height:150px;font-size:12px}
.wgrid{display:grid;grid-template-columns:48px 1fr 1fr;gap:6px;align-items:center;margin:4px 0}
.wgrid input{width:100%;padding:6px 8px}
.wgrid .hd{font-size:11px;color:var(--sub)}
.btns2{display:flex;gap:6px}.btns2 button{flex:1;padding:6px 4px;font-size:13px}
.g3{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.g3 label{display:flex;flex-direction:column;font-size:11px;color:var(--sub);gap:2px}
.g3 input{width:100%;padding:6px 8px}
</style></head><body>

<script>window.onerror=function(m,u,l){var e=document.getElementById("empty");if(e){e.style.color="#e53935";e.innerHTML="Ошибка: "+m+" (строка "+l+")";}};</script>
<script>
let K=.5,U=1,Q=1,FIT=1,uid=1;
const TN={o:'Розетка',s:'Выключатель',p:'Проходной (аллер-ретур)',w:'Свет (лампа)',l:'LED-спираль',x:'Другое'},TS={o:'розетка',s:'выкл.',p:'проходной',w:'свет',l:'LED',x:'другое'},TB={o:'Розетка',s:'Выкл.',p:'Проход.',w:'Свет',l:'LED',x:'Другое'},TC={o:'#d2331f',s:'#1f7ad2',p:'#0e9aa7',w:'#d1a000',l:'#8a2be2',x:'#2a8f4e'},QI={o:'●',s:'■',p:'◐',l:'〰',x:'◇'};
const WC={brown:'#8b5a2b',blue:'#2b6fdd',yg:'#9ac52e',red:'#d22',black:'#222'},CN={brown:'коричневый',blue:'синий',yg:'жёлто-зелёный',red:'красный',black:'чёрный'},CNS={brown:'коричн.',blue:'синий',yg:'жёл-зел.',red:'красный',black:'чёрный'};
const COL={brown:['коричневый (фаза / общий)','#8b5a2b'],blue:['синий (ноль)','#2b6fdd'],yg:['жёлто-зелёный (земля)','#9ac52e'],red:['красный (выход выкл. / перемычка)','#d22'],black:['чёрный (перемычка)','#222']};
const WIRES={o:[['brown',2.5],['blue',2.5],['yg',2.5]],s:[['brown',1.5],['red',1.5]],p:[['brown',1.5],['red',1.5],['black',1.5]],l:[['brown',1.5],['blue',1.5]],x:[['brown',1.5],['blue',1.5],['yg',1.5]],w:[['brown',1.5],['blue',1.5],['yg',1.5]]};
const WHERE={o:'L, N, PE из щитка соединяются с проводами того же цвета розетки.',s:'Фаза из щитка → вход выключателя (коричневый). Выход (красный) → фаза светильника.',p:'Пара выключателей. Общий первого ← фаза из щитка. Красный и чёрный идут между двумя коробками. Общий второго → фаза светильника.',l:'L и N из щитка → питание LED.',x:'Как у розетки, сечение 1,5 мм².',w:'Лампа: фаза L приходит от выключателя (красный провод выключателя), N и PE — из щитка.'};
const LET='абвгде',GN={1:'одиночная',2:'двойная',3:'тройная',4:'четверная',5:'пятерная',6:'шестерная'},JS=['7x7','10x10','10x15'],TYPES=['o','s','p','w','l','x'],PL=['А','В','С','Д','Е','К','Л','М'];
const SYM={
 o:'<path d="M5 17V11a7 7 0 0 1 14 0v6M12 2v20"/>',
 s:'<circle cx="8" cy="17" r="4"/><path d="M11 14l8-9M16.4 3.4l5.2 3.2"/>',
 p:'<circle cx="8" cy="17" r="4"/><path d="M11 14l8-9M16.4 3.4l5.2 3.2M12.4 7.2l5.2 4.6"/>',
 l:'<path d="M2 12h20"/><circle cx="5" cy="12" r="2.6"/><circle cx="12" cy="12" r="2.6"/><circle cx="19" cy="12" r="2.6"/><path d="M3.4 10.4l3.2 3.2M6.6 10.4l-3.2 3.2M10.4 10.4l3.2 3.2M13.6 10.4l-3.2 3.2M17.4 10.4l3.2 3.2M20.6 10.4l-3.2 3.2"/>',
 x:'<path d="M2 15C5 4 9 4 12 12S19 20 22 9"/>',
 w:'<path d="M12 3a6 6 0 0 0-3.5 10.9c.6.5 1 1.3 1 2.1h5c0-.8.4-1.6 1-2.1A6 6 0 0 0 12 3z"/><path d="M9.5 18.5h5M10.5 21h3"/>'};
const symSvg=(t,sz,col)=>`<svg viewBox="0 0 24 24" width="${sz}" height="${sz}" fill="none" stroke="${col||TC[t]}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">${SYM[t]}</svg>`;
const NUDGE=[[-10,'← 10'],[-1,'← 1'],[1,'1 →'],[10,'10 →']];
const tzOf=w=>w.tz!=null?w.tz:w.h-30;
const gpOf=b=>b.gp!=null?b.gp:7.1;
const elH=(b,k)=>{const e=b.eh&&b.eh[k];if(e!=null)return e;const g=b.ts.length;return b.or=='v'?bh(b)+((g-1)/2-k)*gpOf(b):bh(b);};
const $=id=>document.getElementById(id);
const num=v=>Math.max(0,parseFloat(v)||0),clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const esc=s=>String(s).replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;');
const fmt=n=>String(n).replace('.',',');

/* ---------- данные ---------- */
const SK='elplan.v2';
const DEFHD={o:30,s:90,p:90,w:220,l:200,x:100};
function fixHd(){P.hd=Object.assign({},DEFHD,P.hd||{});}
let P,CR;
const S={ri:0,cw:0,px:0,py:0,shift:0,pop:null,qg:1,qo:'h',qs:'in',hist:[],vx:-25,vy:-35,z:1,tt:'pipes',ts:'room',nn:3,cdel:null,io:'',saved:true};
const newWall=()=>({len:400,h:250,touched:false,b:[]});
const newRoom=(name,n)=>({name,n,w:[newWall(),newWall(),newWall(),newWall()],p:{w:0,x:100,h:150,on:true},pairs:[]});
const pOn=()=>CR.p.on!==false;
const mkBox=(x,t)=>({id:uid++,x,ts:[t],or:'h',pc:null,fr:'L',hc:null,js:'10x10',name:'',np:false,sd:'in',nj:false});
function load(){try{const j=JSON.parse(localStorage.getItem(SK)||'null');if(j&&j.P&&j.P.rooms&&j.P.rooms.length){P=j.P;fixHd();S.ri=Math.min(j.ri||0,P.rooms.length-1);uid=Math.max(uid,j.uid||1);return true;}}catch(e){}return false;}
function save(){try{localStorage.setItem(SK,JSON.stringify({P,ri:S.ri,uid}));S.saved=true;}catch(e){S.saved=false;}}
function initP(){P={name:'Проект 1',rooms:[newRoom('Комната 1',2)],hd:Object.assign({},DEFHD)};S.ri=0;}
if(!load())initP();
CR=P.rooms[S.ri];
const withRoom=(rm,fn)=>{const o=CR;CR=rm;try{return fn();}finally{CR=o;}};
const CW=()=>CR.w[Math.min(S.cw,CR.n-1)];
const bh=b=>b.hc!=null?b.hc:(P.hd[b.ts[0]]!=null?P.hd[b.ts[0]]:DEFHD[b.ts[0]]);
function boxById(id){for(let wi=0;wi<CR.w.length;wi++){const b=CR.w[wi].b.find(x=>x.id==id);if(b)return {b,wi};}return null;}
const curId=()=>S.pop&&S.pop.id!=null?S.pop.id:null;
const curO=()=>curId()==null?null:boxById(curId());
function guess(n){n=n.toLowerCase();if(/проходн|аллер|переключат/.test(n))return'p';if(/розет/.test(n))return'o';if(/ламп|светильн|люстр|(^|[^а-яё])свет/.test(n))return'w';if(/выкл|включ/.test(n))return's';if(/спирал|led|подсвет|(^|[^а-яё])л[её]д/.test(n))return'l';return null;}

/* ---------- пары проходных ---------- */
function pairInfo(id){const p=CR.pairs.find(q=>q.a==id||q.b==id);if(!p)return null;const A=p.a==id;return {p,role:A?'A':'B',partner:A?p.b:p.a,name:A?p.name:p.name+'1',pname:p.name,partnerName:A?p.name+'1':p.name};}
const freeLetter=()=>PL.find(n=>!CR.pairs.some(q=>q.name==n))||('П'+(CR.pairs.length+1));
function syncPairs(){
  const has=id=>{const o=boxById(id);return !!o&&o.wi<CR.n&&o.b.ts.includes('p');};
  CR.pairs=CR.pairs.filter(q=>has(q.a)&&has(q.b));
  const used=new Set(CR.pairs.flatMap(q=>[q.a,q.b])),free=[];
  CR.w.slice(0,CR.n).forEach((w,wi)=>w.b.forEach(b=>{if(b.ts.includes('p')&&!b.np&&!used.has(b.id))free.push({id:b.id,wi,x:b.x});}));
  free.sort((p,q)=>p.wi-q.wi||p.x-q.x);
  for(let i=0;i+1<free.length;i+=2)CR.pairs.push({a:free[i].id,b:free[i+1].id,name:freeLetter()});
}
function mkPair(a,b){
  CR.pairs=CR.pairs.filter(q=>q.a!=a&&q.b!=a&&q.a!=b&&q.b!=b);
  [a,b].forEach(id=>{const o=boxById(id);if(o)o.b.np=false;});
  CR.pairs.push({a,b,name:freeLetter()});redraw();
}
function unpair(id){const pi=pairInfo(id);if(!pi)return;[pi.p.a,pi.p.b].forEach(i=>{const o=boxById(i);if(o)o.b.np=true;});CR.pairs=CR.pairs.filter(q=>q!==pi.p);redraw();}
function renPair(a,v){const q=CR.pairs.find(p=>p.a==a);if(q&&v.trim())q.name=v.trim();redraw();}

/* ---------- трубы ---------- */
const PW={o:1,s:1.5,p:1.5},MIXC='#a0522d';
function pipesFor(t,n){return t=='l'?n:Math.ceil(n/3);}
function combInfo(b){
  const comb=b.ts.filter(t=>PW[t]);if(!comb.length)return null;
  const load=comb.reduce((a,t)=>a+PW[t],0),n=Math.ceil(load/3-1e-9),kinds=['o','s','p'].filter(t=>comb.includes(t));
  return {n,mixed:kinds.length>1,kinds,comb,color:kinds.length>1?MIXC:TC[kinds[0]]};
}
function pipeList(b){
  if(b.pc!=null)return Array(b.pc).fill(TC[b.ts[0]]);
  const r=[],ci=combInfo(b);
  if(ci)for(let q=0;q<ci.n;q++)r.push(ci.color);
  ['w','l','x'].forEach(t=>{const n=b.ts.filter(x=>x==t).length;for(let q=0;q<pipesFor(t,n);q++)r.push(TC[t]);});
  return r;}
const pcOf=b=>pipeList(b).length;
function pipeInfo(b){
  if(b.pc!=null)return 'задано вручную';
  const ci=combInfo(b),parts=[];
  if(ci)parts.push(ci.kinds.map(t=>TS[t]+' '+ci.comb.filter(x=>x==t).length).join(' + ')+' → '+ci.n+(ci.mixed?' общ. тр.':' тр.'));
  ['w','l','x'].forEach(t=>{const n=b.ts.filter(x=>x==t).length;if(n)parts.push(TS[t]+' '+n+' → '+pipesFor(t,n)+' тр.');});
  return parts.join(', ');
}

function trunkPipes(os,R){
  const arr=os.slice().sort((a,b)=>Math.abs(b.s-R.sp)-Math.abs(a.s-R.sp)),r=[],rest=[];
  arr.forEach((o,i)=>{
    const u=pipeList(o.b);
    if(i==0&&isRd(R,o.b)){u.forEach(c=>r.push(c));return;}
    u.forEach(c=>rest.push(c));
  });
  for(let q=0;q<rest.length;q+=2){const a=rest[q],b=rest[q+1];r.push(b===undefined||a===b?a:MIXC);}
  return r;
}

  const arr=`Пришло: ${R.nA?(R.two?'слева ':'')+R.nA+' тр.':''}${R.nB?' · справа '+R.nB+' тр.':''} · всего ${R.N}.`;
  const wallSeg=seg([...Array(CR.n).keys()].map(i=>[i,'Стена '+(i+1)]),R.pw,v=>`CR.p.w=${v};CR.p.x=Math.min(CR.p.x,CR.w[${v}].len);redraw()`);
  const btn=`<div class="row">${on?'<button class="danger" onclick="CR.p.on=false;redraw()">🗑 Удалить щиток</button>':'<button class="go" onclick="CR.p.on=true;redraw()">+ Вернуть щиток</button>'}</div>`;
  const body=on?btn+
    `<div class="hint">Сюда сходятся все трубы. ${arr}</div><div class="q">На какой стене</div>${wallSeg}`+
    `<div class="q">Подвинуть по стене</div>${seg(NUDGE,null,v=>`nudgeP(${v})`)}`+
    `<div class="row"><label>От левого края стены, см<input type="number" value="${CR.p.x}" onchange="CR.p.x=clamp(num(this.value),0,${w.len});redraw()"></label><label>Высота центра, см<input type="number" value="${CR.p.h}" onchange="CR.p.h=num(this.value);redraw()"></label></div>`
   :btn+
    `<div class="hint">Щитка здесь нет. Трубы идут по стенам до конца стены и там заканчиваются. ${arr}</div><div class="q">На какой стене кончаются трубы</div>${wallSeg}`+
    `<div class="q">В какую сторону они идут</div>${seg([['s','← к началу стены'],['e','к концу стены →']],R.sp==R.cum[R.pw]?'s':'e',v=>`CR.p.e='${v}';redraw()`)}`;
  return {modal:false,title:'<span style="display:inline-block;width:16px;height:16px;background:#444;border:1.5px solid #000;vertical-align:middle;margin-right:6px"></span>'+(on?'Щиток':'Щитка нет · конец труб'),tabs:'',body};
}

/* комнаты */
const stenW=n=>n==1?'стена':n<5?'стены':'стен';
function popRooms(){
  let h=`<div class="row"><label>Проект<input type="text" value="${esc(P.name)}" onchange="P.name=this.value;redraw()"></label></div><div class="q">Комнаты проекта</div>`;
  P.rooms.forEach((rm,i)=>{const cnt=rm.w.slice(0,rm.n).reduce((a,w)=>a+w.b.length,0);
    h+=`<div class="sec"><div class="row"><input type="text" style="flex:1;min-width:130px" value="${esc(rm.name)}" onchange="renRoom(${i},this.value)"><button class="${i==S.ri?'on':'go'}" onclick="setRoom(${i})">${i==S.ri?'Открыта':'Открыть'}</button></div><div class="hint">${rm.n} ${stenW(rm.n)} · мест для коробок: ${cnt}</div><div class="row"><button onclick="dupRoom(${i})">Копия</button><button class="danger" onclick="delRoom(${i})">${S.cdel==i?'Точно удалить?':'Удалить'}</button></div></div>`;});
  h+=`<div class="q">Новая комната</div><div class="row"><label>Название<input type="text" id="nrn" style="width:170px" placeholder="Комната ${P.rooms.length+1}"></label></div><div class="hint">Сколько стен:</div>${seg([1,2,3,4].map(k=>[k,k]),S.nn,v=>`S.nn=${v};keepName();redraw()`)}<div class="row"><button class="go" onclick="createRoom()">+ Создать комнату</button><button onclick="openPop('io')">Копия проекта</button></div>`;
  return {modal:true,title:'Комнаты',tabs:'',body:h};
}
function keepName(){const e=$('nrn');S.nname=e?e.value:'';}
function setRoom(i){S.ri=i;CR=P.rooms[i];S.cw=0;S.hist=[];S.pop=null;S.cdel=null;redraw();}
function renRoom(i,v){P.rooms[i].name=v.trim()||P.rooms[i].name;redraw();}
function createRoom(){const e=$('nrn'),name=(e&&e.value.trim())||'Комната '+(P.rooms.length+1);P.rooms.push(newRoom(name,S.nn));setRoom(P.rooms.length-1);}
function dupRoom(i){const c=JSON.parse(JSON.stringify(P.rooms[i]));c.name+=' (копия)';P.rooms.splice(i+1,0,c);setRoom(i+1);}
function delRoom(i){if(P.rooms.length<2)return;if(S.cdel!=i){S.cdel=i;redraw();return;}P.rooms.splice(i,1);S.ri=Math.min(S.ri,P.rooms.length-1);CR=P.rooms[S.ri];S.cw=0;S.hist=[];S.cdel=null;redraw();}
function popIo(){
  const txt=S.io||JSON.stringify({P,ri:S.ri});
  return {modal:true,title:'Копия проекта',tabs:'',body:`<div class="hint">Скопируй этот текст и сохрани в заметки — это резервная копия. Чтобы вернуть проект, вставь текст сюда и нажми «Загрузить».</div><textarea id="iot">${esc(txt)}</textarea><div class="row"><button class="go" onclick="loadIo()">Загрузить</button><button onclick="S.io='';redraw()">Обновить текст</button></div>`};
}
function loadIo(){try{const j=JSON.parse($('iot').value);if(!j.P||!j.P.rooms||!j.P.rooms.length)throw 0;P=j.P;fixHd();S.ri=Math.min(j.ri||0,P.rooms.length-1);CR=P.rooms[S.ri];S.cw=0;S.hist=[];S.pop=null;redraw();}catch(e){alert('Не получилось прочитать текст проекта.');}}
function popRoom(){
  let h=`<div class="row" style="align-items:center;margin:2px 0"><input type="text" style="flex:1;min-width:110px" value="${esc(CR.name)}" onchange="renRoom(${S.ri},this.value)"><div style="width:150px">${seg([1,2,3,4].map(k=>[k,k]),CR.n,v=>`setRN(${v})`)}</div></div><div class="hint" style="margin:0">Стен: 1 — прямая, 2 — Г, 3 — П, 4 — квадрат.</div>`+
  `<div class="q" style="margin-top:6px">Размеры стен</div><div class="wgrid"><span></span><span class="hd">Длина, см</span><span class="hd">Высота, см</span>`;
  for(let i=0;i<CR.n;i++){const w=CR.w[i];
    h+=`<b>Ст.${i+1}</b><input type="number" value="${w.len}" onchange="uw(${i},'len',this.value)"><input type="number" value="${w.h}" onchange="uw(${i},'h',this.value)">`;
    if(i==0)h+=`<div class="btns2" style="grid-column:1/-1"><button onclick="wAll(0,'len')">⇉ длина всем</button><button onclick="wAll(0,'h')">⇉ высота всем</button></div>`;}
  h+=`</div><div class="hint" style="margin:0">Размер стены 1 сам встаёт на все стены, пока другую не поправишь вручную.</div>`+
  `<div class="q" style="margin-top:8px">Высоты по умолчанию от пола, см</div><div class="g3">${TYPES.map(k=>`<label>${TS[k]}<input type="number" value="${P.hd[k]}" onchange="P.hd['${k}']=num(this.value);redraw()"></label>`).join('')}</div><div class="row"><button onclick="openPop('panel')">▮ Щиток / выход труб</button></div>`;
  return {modal:true,title:'Комната: настройки',tabs:'',body:h};
}
function setRN(n){CR.n=n;S.cw=Math.min(S.cw,n-1);CR.p.w=Math.min(CR.p.w,n-1);redraw();}
function applyW(w,k){if(k=='len'){if(!w.touched)respread(w);else w.b.forEach(b=>b.x=Math.min(b.x,w.len));}else if(w.tz!=null)w.tz=clamp(w.tz,20,w.h-5);}
function uw(i,k,v){const w=CR.w[i];w[k]=Math.max(10,num(v));applyW(w,k);
  if(i==0)CR.w.forEach((x,j)=>{if(j>0&&!x['o'+k]){x[k]=w[k];applyW(x,k);}});else w['o'+k]=true;
  redraw();}
function wAll(i,k){const v=CR.w[i][k];CR.w.forEach((x,j)=>{if(j!==i){x[k]=v;delete x['o'+k];applyW(x,k);}});redraw();}

/* итоги */
function calc(rm){return withRoom(rm,()=>{
  const R=ring(),pw=CR.w[R.pw],tot={},js={},cnt={};let vp=0,rb=0;
  const rows=R.all.slice().sort((a,b)=>R.br[a.b.id]!=R.br[b.b.id]?(R.br[a.b.id]>R.br[b.b.id]?1:-1):R.nm[a.b.id]-R.nm[b.b.id]).map(o=>{
    const b=o.b,w=CR.w[o.wi],pc=pcOf(b),vlen=Math.max(...b.ts.map((t,k)=>Math.abs(tzOf(w)-elH(b,k)))),hlen=Math.abs(o.s-R.sp)+(pOn()?Math.abs(tzOf(w)-tzOf(pw))+Math.abs(tzOf(pw)-CR.p.h):0),len=vlen+hlen,pi=b.ts.includes('p')?pairInfo(b.id):null;
    vp+=vlen*pc;
    if(!b.nj){if(isRd(R,b))rb++;else{const k=jsOf(R,b);js[k]=(js[k]||0)+1;}}
    b.ts.forEach(t=>{cnt[t]=(cnt[t]||0)+1;WIRES[t].forEach(([c,s])=>{const k=c+'|'+s;tot[k]=(tot[k]||0)+len+15+(CR.p.on!==false?50:0);});});
    return {lab:R.lab(b.id),b,wi:o.wi,pc,len,vlen,hlen,pi};});
  const ev=[...new Set([0,R.cum[R.cum.length-1],R.sp,...R.all.map(o=>o.s)])].sort((a,b)=>a-b);
  let hm=0;for(let i=0;i<ev.length-1;i++)hm+=pipesAt(R,(ev[i]+ev[i+1])/2).length*(ev[i+1]-ev[i]);
  if(pOn())hm+=R.N*Math.abs(tzOf(pw)-CR.p.h);
  return {rm,R,rows,tot,js,cnt,rb,pipes:vp+hm,vp,hm};
});}
const GNn=g=>GN[g];
function refTable(){return `<table><tr><th>Тип</th><th>Провода</th><th>Что с чем</th></tr>${TYPES.map(t=>`<tr><td>${TN[t]}</td><td>${WIRES[t].map(([c])=>`<span class="sw" style="background:${WC[c]}"></span>${CN[c]}`).join('<br>')}<br><b>${WIRES[t].length} × ${fmt(WIRES[t][0][1])} мм²</b></td><td>${WHERE[t]}</td></tr>`).join('')}</table>`;}
function popTot(){
  const all1=S.ts=='all',D=(all1?P.rooms:[CR]).map(calc);
  const tab=S.tt,agg=(k)=>{const r={};D.forEach(d=>Object.keys(d[k]).forEach(x=>r[x]=(r[x]||0)+d[k][x]));return r;};
  let body='';
  if(tab=='pipes'){
    if(!all1){const d=D[0],R=d.R;
      if(!R.G)body='<div class="hint">В этой комнате пока нет коробок.</div>';
      else{
        body=`<table><tr><th>№</th><th>Что</th><th>Ст.</th><th>Выс.</th><th>Верт. труб × м</th></tr>${d.rows.map(r=>`<tr><td>${r.lab}</td><td>${r.b.ts.length>1?GN[r.b.ts.length]+(r.b.or=='v'?' верт.':' гориз.')+': ':''}${r.b.ts.map(t=>TS[t]).join('+')}${r.pi?' «'+esc(r.pi.name)+'»':''}${r.b.name?' ('+esc(r.b.name)+')':''}</td><td>${r.wi+1}</td><td>${bh(r.b)}</td><td>${r.pc} × ${fmt((Math.round(r.vlen)/100).toFixed(2))}</td></tr>`).join('')}</table><div class="note">Вертикальные трубы: ${fmt((Math.ceil(d.vp/10)/10).toFixed(1))} м. Горизонтальные (общие): ${fmt((Math.ceil(d.hm/10)/10).toFixed(1))} м.</div>`+
        `<div class="q">${pOn()?'Трубы в щиток':'Трубы на выход'}</div><table>${R.nA?`<tr><td>Пришло ${R.two?'слева':'с одной стороны'}</td><td><b>${R.nA} тр.</b></td></tr>`:''}${R.nB?`<tr><td>Пришло справа</td><td><b>${R.nB} тр.</b></td></tr>`:''}<tr><td>Всего ${pOn()?'у щитка':'на выходе'} (стена ${R.pw+1})</td><td><b>${R.N} тр.</b></td></tr></table>`;
        if(CR.n>1)body+=`<div class="q">Трубы на стыках стен</div><table>${withRoom(CR,()=>[...Array(CR.n-1).keys()].map(i=>`<tr><td>Стена ${i+1} → ${i+2}</td><td>${cntAt(R,R.cum[i+1])} тр.</td></tr>`).join(''))}</table>`;
      }
    }else body=`<table><tr><th>Комната</th><th>Мест</th><th>Труб в щиток</th><th>Труб, м</th></tr>${D.map(d=>`<tr><td>${esc(d.rm.name)}</td><td>${d.R.G}</td><td>${d.R.N}</td><td>${fmt((Math.ceil(d.pipes/10)/10).toFixed(1))}</td></tr>`).join('')}</table>`;
    body+=`<div class="note">Труб всего: ${fmt((Math.ceil(D.reduce((a,d)=>a+d.pipes,0)/10)/10).toFixed(1))} м.</div>`;
  }else if(tab=='wires'){
    const tot=agg('tot');
    body=`<table><tr><th>Цвет</th><th>Сечение</th><th>Метров</th></tr>${Object.keys(tot).sort().map(k=>{const [c,s]=k.split('|');return `<tr><td><span class="sw" style="background:${COL[c][1]}"></span>${COL[c][0]}</td><td>${fmt(s)} мм²</td><td>${fmt((Math.ceil(tot[k]*1.1/10)/10).toFixed(1))}</td></tr>`;}).join('')||'<tr><td colspan="3">Пока нет данных</td></tr>'}</table><div class="note">Провод на каждый элемент: длина трубы + 15 см в коробке + 50 см в щитке, запас 10%. Если щитка нет — без запаса 50 см.</div>`;
  }else if(tab=='boxes'){
    const js=agg('js'),cnt=agg('cnt'),rb=D.reduce((a,d)=>a+d.rb,0);
    body=`<div class="q">Распределительные коробки</div><table>${Object.keys(js).map(k=>`<tr><td>${esc(k.replace('x','×'))}</td><td>${js[k]} шт.</td></tr>`).join('')}${rb?`<tr><td>круглые (по краям, одиночные)</td><td>${rb} шт.</td></tr>`:''}${!Object.keys(js).length&&!rb?'<tr><td colspan="2">Пока нет данных</td></tr>':''}</table>`+
    `<div class="q">Подрозетники (элементы)</div><table>${TYPES.filter(t=>cnt[t]).map(t=>`<tr><td>${TN[t]}</td><td>${cnt[t]} шт.</td></tr>`).join('')||'<tr><td colspan="2">Пока нет данных</td></tr>'}</table>`;
  }else body=refTable();
  const tabs=`<div class="tabs"><button class="${all1?'':'on'}" onclick="S.ts='room';redraw()">Эта комната</button><button class="${all1?'on':''}" onclick="S.ts='all';redraw()">Весь проект</button></div>`+tabsH([['pipes','Трубы'],['wires','Провода'],['boxes','Коробки'],['ref','Схемы']],tab,v=>`S.tt='${v}';redraw()`);
  return {modal:true,title:'📊 Итоги · '+(all1?esc(P.name):esc(CR.name)),tabs,body};
}

/* ---------- действия ---------- */
function redraw(){syncPairs();renderTop();renderRails();renderDock();renderPop();draw3d();renderEmpty();save();}
function near(d){const o=curO();if(!o)return;const w=CR.w[o.wi],b=mkBox(clamp(o.b.x+d*50,0,w.len),'o');w.b.push(b);w.touched=true;S.pop={k:'box',id:b.id,tab:'pos'};redraw();}
function nudge(d){const o=curO();if(!o)return;o.b.x=clamp(o.b.x+d,0,CR.w[o.wi].len);CR.w[o.wi].touched=true;redraw();}
function ehSet(k,v){const o=curO();if(!o)return;const b=o.b;b.eh=b.eh||[];b.eh[k]=v===''?null:clamp(num(v),0,CR.w[o.wi].h);CR.w[o.wi].touched=true;redraw();}
function ehAdd(k,d){const o=curO();if(o)ehSet(k,elH(o.b,k)+d);}
function gpAdd(d){const o=curO();if(o)eb('gp',gpOf(o.b)+d);}
function nudgeP(d){CR.p.x=clamp(CR.p.x+d,0,CR.w[CR.p.w].len);redraw();}
function delBox(){const o=curO();if(!o)return;const w=CR.w[o.wi];w.b=w.b.filter(b=>b.id!=o.b.id);if(!w.touched)respread(w);S.pop=null;redraw();}
function et(k,v){const o=curO();if(!o)return;CR.w[o.wi].touched=true;o.b.ts[k]=v;if(k==0)o.b.hc=null;redraw();}
function eb(f,v){const o=curO();if(!o)return;const b=o.b,w=CR.w[o.wi];w.touched=true;
  if(f=='g'){const k=+v;while(b.ts.length<k)b.ts.push(b.ts[b.ts.length-1]);b.ts.length=k;b.pc=null;if(b.eh)b.eh=b.eh.slice(0,k);}
  else if(f=='pc'){b.pc=v===''?null:Math.max(1,Math.round(num(v)));}
  else if(f=='name'){b.name=v;const g=guess(v);if(g){b.ts[0]=g;b.hc=null;}}
  else if(f=='pos'){const p=clamp(num(v),0,w.len);b.x=b.fr=='R'?w.len-p:p;}
  else if(f=='gp'){b.gp=clamp(num(v),7,60);}
  else if(f=='hc'){b.hc=v===''?null:num(v);}
  else b[f]=v;
  redraw();}

/* ---------- жесты: вращение, щипок, тап ---------- */
const st=$('stage'),ptr=new Map();let pd=null,mv=false,pdist=0,zq=0,pmid=null;
const dist2=()=>{const a=[...ptr.values()];return a.length<2?0:Math.hypot(a[0][0]-a[1][0],a[0][1]-a[1][1]);};
const zsoft=()=>{if(!zq)zq=requestAnimationFrame(()=>{zq=0;draw3d();});};
st.addEventListener('pointerdown',e=>{if(e.target.closest('#zoom'))return;ptr.set(e.pointerId,[e.clientX,e.clientY]);if(ptr.size==1){pd=[e.clientX,e.clientY];mv=false;}else{pdist=dist2();pmid=null;mv=true;document.body.classList.add('pz');}});
st.addEventListener('pointermove',e=>{
  if(!ptr.has(e.pointerId))return;ptr.set(e.pointerId,[e.clientX,e.clientY]);
  if(ptr.size>=2){const nd=dist2(),a=[...ptr.values()],mx=(a[0][0]+a[1][0])/2,my=(a[0][1]+a[1][1])/2;if(pmid){S.px+=mx-pmid[0];S.py+=my-pmid[1];view();}pmid=[mx,my];if(pdist>0&&Math.abs(nd-pdist)>1){S.z=clamp(S.z*nd/pdist,.3,6);zsoft();}pdist=nd;return;}
  if(!pd)return;const dx=e.clientX-pd[0],dy=e.clientY-pd[1];if(!mv&&Math.hypot(dx,dy)<8)return;mv=true;S.vy+=dx*.4;S.vx=clamp(S.vx-dy*.4,-85,85);pd=[e.clientX,e.clientY];view();});
function endp(e,tap){
  const had=ptr.has(e.pointerId);ptr.delete(e.pointerId);
  if(had&&tap&&ptr.size==0&&pd&&!mv){const el=e.target.closest&&e.target.closest('[data-id],[data-pn]');
    if(el){if(el.dataset.pn)openPop('panel');else if(el.classList.contains('jb'))openWire(+el.dataset.id);else pick(+el.dataset.id);}}
  pmid=null;if(ptr.size==0){pd=null;pdist=0;document.body.classList.remove('pz');}else if(ptr.size==1)pd=null;
}
st.addEventListener('pointerup',e=>endp(e,true));
st.addEventListener('pointercancel',e=>endp(e,false));
st.addEventListener('wheel',e=>{e.preventDefault();S.z=clamp(S.z*(e.deltaY<0?1.12:.89),.3,6);zsoft();},{passive:false});
$('zp').onclick=()=>{S.z=clamp(S.z*1.25,.3,6);draw3d();};
$('zm').onclick=()=>{S.z=clamp(S.z/1.25,.3,6);draw3d();};
$('zr').onclick=()=>{S.z=1;S.px=0;S.py=0;S.vx=-25;S.vy=-35;draw3d();};
window.addEventListener('resize',draw3d);
window.appBack=()=>{if(S.pop){closePop();return true;}return false;};
redraw();
</script></body></html>
