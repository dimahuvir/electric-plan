<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>План электрика</title>
  <style>
    :root{
      --bg:#0d1d3d;
      --bg2:#111d3a;
      --grid:#2d4e8f;
      --grid-soft:#243d75;
      --line:#dfe9ff;
      --card:rgba(255,255,255,0.12);
      --btn:#f5f6fb;
      --btn-text:#0e1e3d;
      --accent:#2d4fdb;
      --text:#eaf1ff;
      --muted:#b8c8f7;
      --shadow:rgba(0,0,0,.28);
    }

    *{box-sizing:border-box}
    html,body{
      width:100%;
      height:100%;
      margin:0;
      overflow:hidden;
      background:var(--bg);
      color:var(--text);
      font-family:Arial, Helvetica, sans-serif;
    }

    body{
      display:flex;
      align-items:stretch;
      justify-content:center;
      background:linear-gradient(#0d1d3d,#0b1835);
    }

    #app{
      position:relative;
      width:100vw;
      height:100vh;
      background:var(--bg);
      overflow:hidden;
    }

    #top{
      position:relative;
      height:52px;
      display:flex;
      align-items:center;
      justify-content:space-between;
      padding:0 12px;
      color:#fff;
      background:rgba(0,0,0,0.08);
      border-bottom:1px solid rgba(255,255,255,0.2);
      font-weight:700;
      letter-spacing:0.02em;
      z-index:10;
    }

    .status-left{
      display:flex;
      align-items:center;
      gap:10px;
      font-size:18px;
      font-weight:700;
      color:#fff;
    }

    .status-left .time{
      min-width:86px;
      font-size:17px;
      font-weight:700;
      color:#fff;
      letter-spacing:0.03em;
    }

    .status-icons{
      display:flex;
      align-items:center;
      gap:12px;
      font-size:14px;
      color:#fff;
      opacity:0.95;
    }

    .status-right{
      display:flex;
      align-items:center;
      gap:10px;
      font-size:13px;
      font-weight:700;
      color:#fff;
      opacity:0.95;
    }

    .status-badge{
      background:rgba(255,255,255,0.12);
      border:1px solid rgba(255,255,255,0.3);
      border-radius:6px;
      padding:4px 7px;
      font-size:12px;
      line-height:1;
    }

    #stage{
      position:absolute;
      left:0;
      right:0;
      top:52px;
      bottom:58px;
      overflow:hidden;
      background:var(--bg2);
      border-top:1px solid rgba(255,255,255,0.2);
      box-shadow:inset 0 0 0 1px rgba(141,172,230,0.18);
    }

    #world{
      position:absolute;
      inset:0;
      background:
        linear-gradient(var(--grid-soft) 1px, transparent 1px),
        linear-gradient(90deg, var(--grid-soft) 1px, transparent 1px);
      background-size:24px 24px;
      transform-origin:center center;
      transition:transform 0.18s ease;
    }

    #world::before{
      content:"";
      position:absolute;
      inset:0;
      background:rgba(16,31,61,0.24);
    }

    #zoom{
      position:absolute;
      top:12px;
      right:16px;
      display:flex;
      flex-direction:column;
      gap:12px;
      z-index:5;
    }

    .zoom-btn{
      width:52px;
      height:52px;
      border:none;
      border-radius:12px;
      background:rgba(255,255,255,0.08);
      border:2px solid rgba(255,255,255,0.76);
      color:#fff;
      font-size:28px;
      font-weight:700;
      box-shadow:0 6px 16px rgba(0,0,0,0.18);
      cursor:pointer;
    }

    .zoom-btn:active{
      transform:scale(0.96);
    }

    #dock{
      position:absolute;
      left:0;
      right:0;
      bottom:0;
      height:58px;
      display:flex;
      align-items:center;
      background:rgba(6,18,38,0.92);
      border-top:2px solid rgba(255,255,255,0.3);
      color:var(--text);
      padding:8px 12px 10px;
      z-index:10;
    }

    .legend{
      display:flex;
      align-items:center;
      gap:14px;
      white-space:nowrap;
      font-size:13px;
      color:#dfeaff;
      font-weight:600;
      opacity:0.96;
    }

    .legend .dot{
      display:inline-block;
      width:8px;
      height:8px;
      border-radius:2px;
      margin-right:6px;
      vertical-align:middle;
      background:#dfeaff;
    }

    .legend .dot.red{ background:#dfeaff; }
    .legend .dot.blue{ background:#9fb8ff; }
    .legend .dot.green{ background:#dfeaff; }

    .legend .item{
      display:flex;
      align-items:center;
      opacity:0.95;
    }

    .legend .item i{
      display:inline-block;
      width:10px;
      height:10px;
      margin-right:7px;
      border:1px solid rgba(255,255,255,0.7);
      background:transparent;
      transform:translateY(1px);
    }

    .legend .item:nth-child(1) i{
      background:rgba(255,255,255,0.8);
      border-radius:50%;
    }

    .legend .item:nth-child(2) i{
      width:11px;
      height:11px;
      border-radius:2px;
      background:rgba(255,255,255,0.55);
    }

    .legend .item:nth-child(3) i{
      width:12px;
      height:12px;
      clip-path:polygon(0 0,100% 0,100% 100%,0 100%);
      background:rgba(255,255,255,0.8);
      border-radius:0;
    }

    #empty{
      position:absolute;
      left:12px;
      top:12px;
      max-width:70%;
      z-index:20;
      color:#dfeaff;
      font-size:14px;
      line-height:1.35;
      background:rgba(255,255,255,0.06);
      border:1px solid rgba(255,255,255,0.2);
      border-radius:8px;
      padding:10px 12px;
      display:none;
      pointer-events:none;
    }

    @media (max-width:420px){
      .status-left .time{ font-size:16px; }
      .zoom-btn{ width:48px; height:48px; }
    }
  </style>
</head>
<body>
  <div id="app">
    <div id="top">
      <div class="status-left">
        <span class="time">12:21</span>
        <span>📶</span>
        <span>📡</span>
        <span>🔋</span>
      </div>

      <div class="status-right">
        <span>VoLTE</span>
        <span class="status-badge">4G</span>
        <span class="status-badge">84</span>
      </div>
    </div>

    <div id="stage">
      <div id="empty"></div>
      <div id="zoom">
        <button class="zoom-btn" id="zp" type="button">＋</button>
        <button class="zoom-btn" id="zm" type="button">－</button>
        <button class="zoom-btn" id="zr" type="button">⌂</button>
      </div>
      <div id="world"></div>
    </div>

    <div id="dock">
      <div class="legend">
        <span class="item"><i></i>подрозетник</span>
        <span class="item"><i></i>распред. коробка</span>
        <span class="item"><i></i>щиток</span>
      </div>
    </div>
  </div>

  <script>
    // Показываем ошибки запуска прямо на экране.
    window.addEventListener('error', function(e){
      const el = document.getElementById('empty');
      if (!el) return;
      el.textContent = 'Ошибка запуска: ' + (e.message || 'неизвестная ошибка') + ' · строка ' + (e.lineno || '?') + '.';
      el.style.display = 'block';
    });

    const stage = document.getElementById('world');
    let zoomLevel = 1;

    function drawBaseGrid(){
      const cells = [];
      const totalX = 28;
      const totalY = 30;

      for (let y = 0; y < totalY; y++) {
        for (let x = 0; x < totalX; x++) {
          const cell = document.createElement('div');
          cell.style.position = 'absolute';
          cell.style.left = (x * 24) + 'px';
          cell.style.top = (y * 24) + 'px';
          cell.style.width = '24px';
          cell.style.height = '24px';
          cell.style.borderLeft = '1px solid rgba(133, 166, 255, 0.5)';
          cell.style.borderTop = '1px solid rgba(133, 166, 255, 0.5)';
          cell.style.opacity = '0.3';
          cells.push(cell);
        }
      }

      cells.forEach(c => stage.appendChild(c));
    }

    function applyZoom(){
      stage.style.transform = `scale(${zoomLevel})`;
      stage.style.transformOrigin = 'center center';
    }

    document.getElementById('zp').addEventListener('click', () => {
      zoomLevel = Math.min(1.8, zoomLevel + 0.15);
      applyZoom();
    });

    document.getElementById('zm').addEventListener('click', () => {
      zoomLevel = Math.max(0.65, zoomLevel - 0.15);
      applyZoom();
    });

    document.getElementById('zr').addEventListener('click', () => {
      zoomLevel = 1;
      applyZoom();
    });

    drawBaseGrid();
    applyZoom();
  </script>
</body>
</html>
