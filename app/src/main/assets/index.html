<!DOCTYPE html>
<html lang="ru"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>План электрика</title>
<style>
:root{--bg:#f3f1ea;--ink:#1d2a5c;--line:#b9b4a3;--card:#fffdf6;--acc:#2a3f9e;--sub:#5a6180;--red:#e53935;color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#15192b;--ink:#dfe5ff;--line:#3a4268;--card:#1d2340;--acc:#8fa5ff;--sub:#93a0cf;color-scheme:dark}}
*{box-sizing:border-box}
html,body{height:100%;margin:0;overflow:hidden;background:var(--bg);color:var(--ink);font:15px/1.35 "Trebuchet MS",Verdana,sans-serif}
#app{display:flex;flex-direction:column;height:100vh;height:100dvh;padding-top:env(safe-area-inset-top,0px)}
button,select,input,textarea{font:inherit;color:var(--ink);background:var(--card);border:1.5px solid var(--ink);border-radius:8px;padding:7px 9px}
button{cursor:pointer;font-weight:bold}
button.on{background:var(--ink);color:var(--bg)}
button.go{background:var(--acc);color:#fff;border-color:var(--acc)}
button.danger{border-color:var(--red);color:var(--red)}
#top{display:flex;gap:6px;align-items:center;padding:6px 8px;background:var(--card);border-bottom:2px solid var(--ink)}
#top .grow{flex:1}
#top .sv{font-size:11px;color:var(--sub)}
#stage{position:relative;flex:1;min-height:0;perspective:2600px;overflow:hidden;touch-action:none;
background-color:var(--bg);background-image:repeating-linear-gradient(0deg,transparent 0 23px,var(--line) 23px 24px),repeating-linear-gradient(90deg,transparent 0 23px,var(--line) 23px 24px)}
#world{position:absolute;left:50%;top:50%;transform-style:preserve-3d}
.wall{position:absolute;left:0;top:0;transform-origin:0 0;background:rgba(42,63,158,.12);border:2px solid var(--acc);transform-style:preserve-3d;color:var(--ink)}
.wall svg{position:absolute;left:0;top:0;pointer-events:none;overflow:visible}
.zb{position:absolute;right:8px;top:50%;font-size:30px;opacity:.22;pointer-events:none}
.bx{position:absolute;display:flex;transform:translate(-50%,-50%) translateZ(1px)}
.c{box-sizing:border-box;overflow:hidden;white-space:nowrap;color:#fff;font-weight:bold;text-align:center;border:1.5px solid #000;border-radius:50%}
.c.ts,.c.tx{border-radius:3px}.c.tl{border-radius:50% 0 50% 0}.c.tp{border-radius:30%}
.bx.sel{outline:3px solid #ffd400;outline-offset:2px}
.bx .pb{position:absolute;top:-11px;right:-12px;background:#000;color:#fff;font:bold 10px/13px sans-serif;border-radius:7px;padding:0 4px;font-style:normal}
.jb{position:absolute;display:flex;align-items:center;justify-content:center;background:#e8b100;border:1.5px solid #000;transform:translate(-50%,-50%) translateZ(2px);font-weight:bold;color:#000}
.jb.rd{border-radius:50%;background:#fff}
.jb.sel{outline:3px solid #ffd400;outline-offset:2px}
.pn{position:absolute;background:#444;border:1.5px solid #fff;color:#fff;font-weight:bold;text-align:center;transform:translateZ(2px)}
.pn.sel{outline:3px solid #ffd400;outline-offset:2px}
#zoom{position:absolute;right:8px;top:8px;display:flex;flex-direction:column;gap:6px}
#zoom button{width:42px;height:42px;font-size:22px;padding:0}
#legend{position:absolute;left:8px;bottom:6px;font-size:11px;color:var(--sub);pointer-events:none}
#empty{position:absolute;left:12px;right:60px;top:12px;font-size:14px;color:var(--sub);pointer-events:none}
#dock{background:var(--card);border-top:2px solid var(--ink);padding:6px 8px calc(6px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:6px}
.row2{display:flex;gap:6px;align-items:center;flex-wrap:nowrap}
.row2 .hint{flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row2 button{padding:6px 11px}
.qa{display:flex;gap:5px}
.qa button{flex:1;display:flex;flex-direction:column;align-items:center;padding:5px 2px;border-bottom:6px solid var(--c);line-height:1.1;font-size:18px}
.qa button small{font-size:10.5px;font-weight:normal}
.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px;min-height:38px}
.chips button{white-space:nowrap;display:flex;gap:6px;align-items:center;padding:5px 9px;font-weight:normal}
.dots{display:flex;gap:2px}.dots i{width:13px;height:13px;border-radius:3px;border:1px solid #000;display:inline-block}
#pop{position:fixed;inset:0;z-index:50;pointer-events:none}
#pop[hidden]{display:none}
#pop .dim{position:absolute;inset:0;background:rgba(0,0,0,.5);pointer-events:auto}
#pop.sheet .dim{display:none}
#pop .win{position:absolute;left:0;right:0;bottom:0;max-height:62vh;background:var(--card);border-top:3px solid var(--acc);border-radius:16px 16px 0 0;display:flex;flex-direction:column;pointer-events:auto;box-shadow:0 -6px 22px rgba(0,0,0,.3)}
#pop.modal .win{top:5vh;bottom:auto;left:50%;transform:translateX(-50%);width:min(580px,96vw);max-height:88vh;border:3px solid var(--acc);border-radius:16px}
.wh2{display:flex;align-items:center;gap:8px;padding:8px 10px;border-bottom:1px solid var(--line)}
.wh2 b{flex:1;font-size:16px}
.x{width:36px;height:36px;padding:0!important;border-radius:50%!important;background:var(--red)!important;border:2px solid #fff!important;color:#fff!important;font-size:18px;line-height:1;box-shadow:0 1px 4px rgba(0,0,0,.4)}
.tabs{display:flex;gap:5px;padding:6px 8px;overflow-x:auto;border-bottom:1px solid var(--line)}
.tabs button{white-space:nowrap;padding:6px 11px}
.pc{overflow:auto;padding:6px 12px 16px;flex:1}
.row{display:flex;gap:6px;flex-wrap:wrap;align-items:flex-end;margin:6px 0}
.row label{display:flex;flex-direction:column;font-size:12px;color:var(--sub);gap:2px}
.row input[type=number]{width:92px}
.sec{background:var(--card);border:1.5px solid var(--line);border-radius:8px;padding:8px;margin:8px 0}
.st{font-weight:bold;margin-bottom:4px}
.q{font-weight:bold;margin:10px 0 2px}
.hint{font-size:13px;color:var(--sub);margin:2px 0 4px}
.big{font-size:20px;min-width:80px;text-align:center}
.stp{align-items:center!important}
.seg{display:flex;margin:4px 0}
.seg button{flex:1;border-radius:0;font-weight:normal;padding:9px 3px;font-size:14px}
.seg button:first-child{border-radius:8px 0 0 8px}.seg button:last-child{border-radius:0 8px 8px 0}
.seg button.on{font-weight:bold}
.seg button.tb{border-bottom:6px solid var(--c);font-size:12px;padding:9px 2px}
table{width:100%;border-collapse:collapse;background:var(--card);font-size:14px;margin:4px 0}
td,th{border:1px solid var(--line);padding:4px 6px;text-align:left;vertical-align:top}
.sw{display:inline-block;width:14px;height:14px;border-radius:50%;border:1px solid #000;vertical-align:middle;margin-right:6px}
.note{font-size:12px;color:var(--sub)}
ol.tl{margin:4px 0 0;padding-left:20px;font-size:13px}
.rvs{display:flex;flex-wrap:wrap;gap:10px}.rv{flex:1 1 210px}
.rv svg,.jbw svg{display:block;margin:0 auto;width:100%;max-width:300px}
.pv{background:#e8b100;border:1.5px solid #000;margin:6px 0;display:flex;align-items:center;justify-content:center;font:bold 11px sans-serif;color:#000}
textarea{width:100%;height:150px;font-size:12px}
</style></head><body>
<div id="app">
<div id="top"></div>
<div id="stage"><div id="empty" style="color:#e53935;font-weight:bold">Скрипт не запустился: файл index.html скопирован не полностью. Загрузи его заново через Upload files.</div><div id="legend">● подрозетник · ■ распред. коробка · ▮ щиток</div>
<div id="zoom"><button id="zp">+</button><button id="zm">−</button><button id="zr">⌂</button></div>
<div id="world"></div></div>
<div id="dock"></div>
</div>
<div id="pop" hidden></div>
<script>window.onerror=function(m,u,l){var e=document.getElementById("empty");if(e){e.style.color="#e53935";e.innerHTML="Ошибка: "+m+" (строка "+l+")";}};</script>
<script>
let K=.5,U=1,Q=1,FIT=1,uid=1;
const TN={o:'Розетка',s:'Выключатель',p:'Проходной (аллер-ретур)',l:'LED-спираль',x:'Другое'},TS={o:'розетка',s:'выкл.',p:'проходной',l:'LED',x:'другое'},TB={o:'Розетка',s:'Выкл.',p:'Проход.',l:'LED',x:'Другое'},TC={o:'#d2331f',s:'#1f7ad2',p:'#0e9aa7',l:'#8a2be2',x:'#2a8f4e'},QI={o:'●',s:'■',p:'◐',l:'〰',x:'◇'};
const WC={brown:'#8b5a2b',blue:'#2b6fdd',yg:'#9ac52e',red:'#d22',black:'#222'},CN={brown:'коричневый',blue:'синий',yg:'жёлто-зелёный',red:'красный',black:'чёрный'},CNS={brown:'коричн.',blue:'синий',yg:'жёл-зел.',red:'красный',black:'чёрный'};
const COL={brown:['коричневый (фаза / общий)','#8b5a2b'],blue:['синий (ноль)','#2b6fdd'],yg:['жёлто-зелёный (земля)','#9ac52e'],red:['красный (выход выкл. / перемычка)','#d22'],black:['чёрный (перемычка)','#222']};
const WIRES={o:[['brown',2.5],['blue',2.5],['yg',2.5]],s:[['brown',1.5],['red',1.5]],p:[['brown',1.5],['red',1.5],['black',1.5]],l:[['brown',1.5],['blue',1.5]],x:[['brown',1.5],['blue',1.5],['yg',1.5]]};
const WHERE={o:'L, N, PE из щитка соединяются с проводами того же цвета розетки.',s:'Фаза из щитка → вход выключателя (коричневый). Выход (красный) → фаза светильника.',p:'Пара выключателей. Общий первого ← фаза из щитка. Красный и чёрный идут между двумя коробками. Общий второго → фаза светильника.',l:'L и N из щитка → питание LED.',x:'Как у розетки, сечение 1,5 мм².'};
const LET='абвгде',GN={1:'одиночная',2:'двойная',3:'тройная',4:'четверная',5:'пятерная',6:'шестерная'},JS=['7x7','10x10','10x15'],TYPES=['o','s','p','l','x'],PL=['А','В','С','Д','Е','К','Л','М'];
const NUDGE=[[-10,'← 10'],[-1,'← 1'],[1,'1 →'],[10,'10 →']];
const $=id=>document.getElementById(id);
const num=v=>Math.max(0,parseFloat(v)||0),clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const esc=s=>String(s).replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;');
const fmt=n=>String(n).replace('.',',');

/* ---------- данные ---------- */
const SK='elplan.v2';
let P,CR;
const S={ri:0,cw:0,pop:null,qg:1,qo:'h',hist:[],vx:-25,vy:-35,z:1,tt:'pipes',ts:'room',nn:3,cdel:null,io:'',saved:true};
const newWall=()=>({len:400,h:250,touched:false,b:[]});
const newRoom=(name,n)=>({name,n,w:[newWall(),newWall(),newWall(),newWall()],p:{w:0,x:100,h:150},pairs:[]});
const mkBox=(x,t)=>({id:uid++,x,ts:[t],or:'h',pc:null,fr:'L',hc:null,js:'10x10',name:'',np:false});
function load(){try{const j=JSON.parse(localStorage.getItem(SK)||'null');if(j&&j.P&&j.P.rooms&&j.P.rooms.length){P=j.P;S.ri=Math.min(j.ri||0,P.rooms.length-1);uid=Math.max(uid,j.uid||1);return true;}}catch(e){}return false;}
function save(){try{localStorage.setItem(SK,JSON.stringify({P,ri:S.ri,uid}));S.saved=true;}catch(e){S.saved=false;}}
function initP(){P={name:'Проект 1',rooms:[newRoom('Комната 1',2)],hd:{o:30,s:90,p:90,l:200,x:100}};S.ri=0;}
if(!load())initP();
CR=P.rooms[S.ri];
const withRoom=(rm,fn)=>{const o=CR;CR=rm;try{return fn();}finally{CR=o;}};
const CW=()=>CR.w[Math.min(S.cw,CR.n-1)];
const bh=b=>b.hc!=null?b.hc:P.hd[b.ts[0]];
function boxById(id){for(let wi=0;wi<CR.w.length;wi++){const b=CR.w[wi].b.find(x=>x.id==id);if(b)return {b,wi};}return null;}
const curId=()=>S.pop&&S.pop.id!=null?S.pop.id:null;
const curO=()=>curId()==null?null:boxById(curId());
function guess(n){n=n.toLowerCase();if(/проходн|аллер|переключат/.test(n))return'p';if(/розет/.test(n))return'o';if(/выкл|включ|свет/.test(n))return's';if(/спирал|led|подсвет|(^|[^а-яё])л[её]д/.test(n))return'l';return null;}

/* ---------- пары проходных ---------- */
function pairInfo(id){const p=CR.pairs.find(q=>q.a==id||q.b==id);if(!p)return null;const A=p.a==id;return {p,role:A?'A':'B',partner:A?p.b:p.a,name:A?p.name:p.name+'1',pname:p.name,partnerName:A?p.name+'1':p.name};}
const freeLetter=()=>PL.find(n=>!CR.pairs.some(q=>q.name==n))||('П'+(CR.pairs.length+1));
function syncPairs(){
  const has=id=>{const o=boxById(id);return !!o&&o.wi<CR.n&&o.b.ts.includes('p');};
  CR.pairs=CR.pairs.filter(q=>has(q.a)&&has(q.b));
  const used=new Set(CR.pairs.flatMap(q=>[q.a,q.b])),free=[];
  CR.w.slice(0,CR.n).forEach((w,wi)=>w.b.forEach(b=>{if(b.ts.includes('p')&&!b.np&&!used.has(b.id))free.push({id:b.id,wi,x:b.x});}));
  free.sort((p,q)=>p.wi-q.wi||p.x-q.x);
  for(let i=0;i+1<free.length;i+=2)CR.pairs.push({a:free[i].id,b:free[i+1].id,name:freeLetter()});
}
function mkPair(a,b){
  CR.pairs=CR.pairs.filter(q=>q.a!=a&&q.b!=a&&q.a!=b&&q.b!=b);
  [a,b].forEach(id=>{const o=boxById(id);if(o)o.b.np=false;});
  CR.pairs.push({a,b,name:freeLetter()});all();
}
function unpair(id){const pi=pairInfo(id);if(!pi)return;[pi.p.a,pi.p.b].forEach(i=>{const o=boxById(i);if(o)o.b.np=true;});CR.pairs=CR.pairs.filter(q=>q!==pi.p);all();}
function renPair(a,v){const q=CR.pairs.find(p=>p.a==a);if(q&&v.trim())q.name=v.trim();all();}

/* ---------- трубы ---------- */
function pipesFor(t,n){return t=='o'?Math.ceil(n/3):(t=='s'||t=='p')?Math.ceil(n/2):t=='l'?n:Math.ceil(n/3);}
function pipeList(b){
  if(b.pc!=null)return Array(b.pc).fill(TC[b.ts[0]]);
  const r=[];TYPES.forEach(t=>{const n=b.ts.filter(x=>x==t).length;for(let q=0;q<pipesFor(t,n);q++)r.push(TC[t]);});
  return r;}
const pcOf=b=>pipeList(b).length;
function pipeInfo(b){if(b.pc!=null)return 'задано вручную';return TYPES.map(t=>{const n=b.ts.filter(x=>x==t).length;return n?TS[t]+' '+n+' → '+pipesFor(t,n):'';}).filter(Boolean).join(', ');}

function ring(){
  const cum=[0];for(let i=0;i<CR.n;i++)cum.push(cum[i]+CR.w[i].len);
  const all=[];CR.w.slice(0,CR.n).forEach((w,wi)=>w.b.forEach(b=>all.push({b,wi,s:cum[wi]+b.x})));
  all.sort((a,b)=>a.s-b.s);
  const pw=Math.min(CR.p.w,CR.n-1),sp=cum[pw]+CR.p.x,nm={},br={},ed={},bn={};
  const A=all.filter(o=>o.s<=sp),B=all.filter(o=>o.s>sp),cnt=L=>L.reduce((a,o)=>a+pcOf(o.b),0);
  [[A,1],[B,-1]].forEach(([L,dr])=>{
    const n=L.length;if(!n)return;
    ed[L[dr>0?0:n-1].b.id]=true;
    L.forEach((o,i)=>{nm[o.b.id]=dr>0?n-i:i+1;br[o.b.id]=dr>0?'Л':'П';bn[o.b.id]=n;});
  });
  const two=A.length>0&&B.length>0;
  return {cum,all,G:all.length,N:cnt(all),nA:cnt(A),nB:cnt(B),pA:A.flatMap(o=>pipeList(o.b)),pB:B.flatMap(o=>pipeList(o.b)),nm,br,ed,bn,two,pw,sp,lab:id=>(two?br[id]:'')+nm[id]};
}
const isRd=(R,b)=>!!R.ed[b.id]&&R.bn[b.id]>1&&b.ts.length==1&&(b.ts[0]=='o'||b.ts[0]=='s');
function pipesAt(R,s){return R.all.filter(o=>s<=R.sp?o.s<=s:(o.s>=s&&o.s>R.sp)).flatMap(o=>pipeList(o.b));}
const cntAt=(R,s)=>pipesAt(R,s).length;
function jbDim(js){const m=/(\d+(?:[.,]\d+)?)\D+(\d+(?:[.,]\d+)?)/.exec(js||'');const a=m?parseFloat(m[1].replace(',','.')):10,b=m?parseFloat(m[2].replace(',','.')):10;return [clamp(a*1.6,11,40),clamp(b*1.6,11,40),a+'×'+b];}
function grpLay(w,b,L,H,ty,jh){
  const g=b.ts.length,v=b.or=='v',gap=2*Q,top=ty+jh/2+3*Q,bot=H-3*Q,cmax=18*Q,cmin=11*Q;
  const c=v?clamp(Math.floor((bot-top-(g-1)*gap)/g),cmin,cmax):clamp(Math.floor((L-6*Q-(g-1)*gap)/g),cmin,cmax);
  const tw=v?c:g*c+(g-1)*gap,th=v?g*c+(g-1)*gap:c;
  const cx=clamp(b.x*K,tw/2+3*Q,L-tw/2-3*Q),cy=clamp((w.h-bh(b))*K,top+th/2,bot-th/2);
  return {c,cx,cy,top:cy-th/2};
}

/* ---------- 3D ---------- */
let C=[0,0];
function view(){$('world').style.transform=`rotateX(${S.vx}deg) rotateY(${S.vy}deg) translate3d(${-C[0]}px,0,${-C[1]}px)`;}
const ln=(x1,y1,x2,y2,c,w)=>`<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" stroke="${c}" stroke-width="${w}"/>`;
function draw3d(){
  const R=ring(),st=$('stage'),W=st.clientWidth||360,Hh=st.clientHeight||300;
  let gx=0,gz=0,gth=0;const gp=[[0,0]];
  for(let i=0;i<CR.n;i++){gx+=CR.w[i].len*Math.cos(gth*Math.PI/180);gz-=CR.w[i].len*Math.sin(gth*Math.PI/180);gth+=90;gp.push([gx,gz]);}
  const gxs=gp.map(p=>p[0]),gzs=gp.map(p=>p[1]),diag=Math.hypot(Math.max(...gxs)-Math.min(...gxs),Math.max(...gzs)-Math.min(...gzs)),hmax=Math.max(...CR.w.slice(0,CR.n).map(w=>w.h));
  FIT=clamp(Math.min(W*.88/(diag*.5+hmax*.15+10),Hh*.82/(hmax*.5+diag*.2+10)),.25,2.4);
  U=FIT*S.z;K=.5*U;Q=clamp(U,.55,2.2);
  const sid=curId(),sk=S.pop&&S.pop.k;
  let x=0,z=0,th=0,html='',pts=[];
  for(let i=0;i<CR.n;i++){
    const w=CR.w[i],L=w.len*K,H=w.h*K,ty=30*K,sp=Math.max(2.4,3.2*Q),lw=Math.min(3,1.7*Q),fs=Math.min(17,12*Q);pts.push([x,z]);
    let pn='',sv=`<svg width="${L}" height="${H}" viewBox="0 0 ${L} ${H}">`;
    const ev=[0,w.len,...w.b.map(b=>b.x)];if(R.pw==i)ev.push(CR.p.x);
    const xs=[...new Set(ev.map(v=>clamp(v,0,w.len)))].sort((a,b)=>a-b),segs=[];
    for(let k=0;k<xs.length-1;k++)segs.push({a:xs[k],b:xs[k+1],pl:pipesAt(R,R.cum[i]+(xs[k]+xs[k+1])/2)});
    const longest=segs.reduce((m,s)=>s.pl.length&&(!m||s.b-s.a>m.b-m.a)?s:m,null);
    segs.forEach(s=>{const c=s.pl.length;if(!c)return;const m=Math.min(c,14);
      for(let q=0;q<m;q++){const o=ty+(q-(m-1)/2)*sp;sv+=ln(s.a*K,o,s.b*K,o,s.pl[q],lw);}
      if((s.b-s.a)*K>26*Q||s===longest)sv+=`<text x="${(s.a+s.b)/2*K}" y="${ty-(m-1)*sp/2-4*Q}" font-size="${fs}" font-weight="bold" text-anchor="middle" fill="currentColor" style="stroke:var(--bg);stroke-width:3px;paint-order:stroke">${c}</text>`;});
    const LY={};
    w.b.forEach(b=>{const rd=isRd(R,b),dm=jbDim(b.js),ly=grpLay(w,b,L,H,ty,rd?22*Q:dm[1]*Q);LY[b.id]=ly;
      const pl=pipeList(b),n=Math.min(pl.length,8);
      for(let q=0;q<n;q++){const o=(q-(n-1)/2)*sp;sv+=ln(ly.cx+o,ty,ly.cx+o,ly.top,pl[q],lw);}});
    if(R.pw==i){const px=CR.p.x*K,py=(w.h-CR.p.h)*K,pw2=44*Q,ph=30*Q;

/* ---------- быстрый ввод ---------- */
function respread(w){w.b.sort((a,b)=>a.x-b.x);w.b.forEach((b,i)=>b.x=Math.round(w.len*(i+1)/(w.b.length+1)));}
function gapX(w,skip){
  const xs=[0,...w.b.filter(b=>b!==skip).map(b=>b.x),w.len].sort((a,b)=>a-b);let best=0,bx=w.len/2;
  for(let i=0;i<xs.length-1;i++){if(xs[i+1]-xs[i]>best){best=xs[i+1]-xs[i];bx=(xs[i]+xs[i+1])/2;}}
  return Math.round(bx);
}
function addQuick(t){
  const w=CW(),b=mkBox(0,t);b.ts=Array(S.qg).fill(t);b.or=S.qo;
  w.b.push(b);if(!w.touched)respread(w);else b.x=gapX(w,b);

}
function undo(){
  const id=S.hist.pop();if(id==null)return;
  CR.w.forEach(w=>{const n=w.b.length;w.b=w.b.filter(b=>b.id!=id);if(w.b.length!=n&&!w.touched)respread(w);});
  if(curId()==id)S.pop=null;all();
}

  rows.forEach((r,i)=>{const y=10+i*PH+PH/2;
    s+=wp(r.ext[0],`M${fx+6},${y} L${cx-30},${y}`)+tipS(cx-40,y-2.5,12,5)+wp(r.loc[0],`M${cx+30},${y} L${fx+fw-6},${y}`)+tipS(cx+28,y-2.5,12,5);
    s+=`<rect x="${cx-24}" y="${y-12}" width="48" height="24" rx="5" fill="#f2f2ee" stroke="#777" stroke-width="1.5"/><rect x="${cx-18}" y="${y-15}" width="36" height="6" rx="2" fill="#f08a1c"/><text x="${cx}" y="${y+5}" font-size="12" font-weight="bold" text-anchor="middle" fill="#333">${i+1}</text>`;});
  return `<svg viewBox="0 0 360 ${H}">${s}</svg>`;
}
function popJb(p){
  const o=boxById(p.id);if(!o)return null;
  const b=o.b,R=ring(),rd=isRd(R,b),pi=b.ts.includes('p')?pairInfo(b.id):null,tab=p.tab||'sch',dm=jbDim(b.js);
  let body='';
  if(tab=='sch'){
    const rows=jbRows(b);
    const lines=rows.map((r,i)=>`<li value="${i+1}">${CNS[r.ext[0]]} (${esc(r.ext[1])}) + ${CNS[r.loc[0]]} (${esc(r.loc[1])})</li>`).join('');
    body=`<div class="jbw">${jbSvg(rows)}</div><div class="hint">Серые — кабели, оранжевые рычажки — клеммы. Номер на клемме совпадает с описанием.</div><ol class="tl">${lines}</ol>`+
    `<div class="hint">Всего ${rows.length} соединений (клеммы на 2 провода). Кабели: из щитка${rows.some(r=>r.ext[2]=='l')?', к светильнику':''}${rows.some(r=>r.ext[2]=='j')?', перемычки пары':''} и от подрозетника. Ноль и землю светильника выключатель не коммутирует — их соединяют отдельно.</div>`+
    `<div class="row"><button onclick="pick(${b.id})">● Подрозетник №${R.lab(b.id)} →</button></div>`;
  }else{
    body=`<div class="hint">${rd?'Круглая: стоит на краю ряда над одиночной розеткой или выключателем. ':''}Выбери размер — на стене коробка сразу изменится.</div>${seg(JS.map(k=>[k,k.replace('x','×')]),b.js,v=>`setJs('${v}')`)}`+
    `<div class="row"><label>Другой размер<input type="text" style="width:130px" placeholder="например 15x15" value="${JS.includes(b.js)?'':esc(b.js)}" onchange="setJs(this.value)"></label></div>`+
    `<div class="hint">Так она выглядит на стене:</div><div class="pv" style="width:${Math.min(dm[0]*4,240)}px;height:${Math.min(dm[1]*4,240)}px">${dm[2]}</div>`;
  }
  return {modal:true,title:`<span style="display:inline-block;width:16px;height:16px;background:#e8b100;border:1.5px solid #000;vertical-align:middle;margin-right:6px;${rd?'border-radius:50%;background:#fff':''}"></span>Распред. коробка над №${R.lab(b.id)} · ${rd?'круглая':b.js.replace('x','×')}`,tabs:tabsH([['sch','Схема'],['size','Размер']],tab,v=>`S.pop.tab='${v}';all()`),body};
}
function setJs(v){const o=curO();if(o){o.b.js=String(v).trim()||'10x10';all();}}

/* щиток */
function popPanel(){
  const R=ring(),w=CR.w[R.pw];
  return {modal:false,title:'<span style="display:inline-block;width:16px;height:16px;background:#444;border:1.5px solid #000;vertical-align:middle;margin-right:6px"></span>Щиток',tabs:'',body:
  `<div class="hint">Сюда сходятся все трубы. Пришло: ${R.nA?(R.two?'слева ':'')+R.nA+' тр.':''}${R.nB?' · справа '+R.nB+' тр.':''} · всего ${R.N}.</div>`+
  `<div class="q">На какой стене</div>${seg([...Array(CR.n).keys()].map(i=>[i,'Стена '+(i+1)]),R.pw,v=>`CR.p.w=${v};CR.p.x=Math.min(CR.p.x,CR.w[${v}].len);all()`)}`+
  `<div class="q">Подвинуть по стене</div>${seg(NUDGE,null,v=>`nudgeP(${v})`)}`+
  `<div class="row"><label>От левого края стены, см<input type="number" value="${CR.p.x}" onchange="CR.p.x=clamp(num(this.value),0,${w.len});all()"></label><label>Высота центра, см<input type="number" value="${CR.p.h}" onchange="CR.p.h=num(this.value);all()"></label></div>`};
}

/* комнаты */
const stenW=n=>n==1?'стена':n<5?'стены':'стен';
function popRooms(){
  let h=`<div class="row"><label>Проект<input type="text" value="${esc(P.name)}" onchange="P.name=this.value;all()"></label></div><div class="q">Комнаты проекта</div>`;
  P.rooms.forEach((rm,i)=>{const cnt=rm.w.slice(0,rm.n).reduce((a,w)=>a+w.b.length,0);
    h+=`<div class="sec"><div class="row"><input type="text" style="flex:1;min-width:130px" value="${esc(rm.name)}" onchange="renRoom(${i},this.value)"><button class="${i==S.ri?'on':'go'}" onclick="setRoom(${i})">${i==S.ri?'Открыта':'Открыть'}</button></div><div class="hint">${rm.n} ${stenW(rm.n)} · мест для коробок: ${cnt}</div><div class="row"><button onclick="dupRoom(${i})">Копия</button><button class="danger" onclick="delRoom(${i})">${S.cdel==i?'Точно удалить?':'Удалить'}</button></div></div>`;});
  h+=`<div class="q">Новая комната</div><div class="row"><label>Название<input type="text" id="nrn" style="width:170px" placeholder="Комната ${P.rooms.length+1}"></label></div><div class="hint">Сколько стен:</div>${seg([1,2,3,4].map(k=>[k,k]),S.nn,v=>`S.nn=${v};keepName();all()`)}<div class="row"><button class="go" onclick="createRoom()">+ Создать комнату</button><button onclick="openPop('io')">Копия проекта</button></div>`;
  return {modal:true,title:'Комнаты',tabs:'',body:h};
}
function keepName(){const e=$('nrn');S.nname=e?e.value:'';}
function setRoom(i){S.ri=i;CR=P.rooms[i];S.cw=0;S.hist=[];S.pop=null;S.cdel=null;all();}
function renRoom(i,v){P.rooms[i].name=v.trim()||P.rooms[i].name;all();}
function createRoom(){const e=$('nrn'),name=(e&&e.value.trim())||'Комната '+(P.rooms.length+1);P.rooms.push(newRoom(name,S.nn));setRoom(P.rooms.length-1);}
function dupRoom(i){const c=JSON.parse(JSON.stringify(P.rooms[i]));c.name+=' (копия)';P.rooms.splice(i+1,0,c);setRoom(i+1);}
function delRoom(i){if(P.rooms.length<2)return;if(S.cdel!=i){S.cdel=i;all();return;}P.rooms.splice(i,1);S.ri=Math.min(S.ri,P.rooms.length-1);CR=P.rooms[S.ri];S.cw=0;S.hist=[];S.cdel=null;all();}
function popIo(){
  const txt=S.io||JSON.stringify({P,ri:S.ri});
  return {modal:true,title:'Копия проекта',tabs:'',body:`<div class="hint">Скопируй этот текст и сохрани в заметки — это резервная копия. Чтобы вернуть проект, вставь текст сюда и нажми «Загрузить».</div><textarea id="iot">${esc(txt)}</textarea><div class="row"><button class="go" onclick="loadIo()">Загрузить</button><button onclick="S.io='';all()">Обновить текст</button></div>`};
}
function loadIo(){try{const j=JSON.parse($('iot').value);if(!j.P||!j.P.rooms||!j.P.rooms.length)throw 0;P=j.P;S.ri=Math.min(j.ri||0,P.rooms.length-1);CR=P.rooms[S.ri];S.cw=0;S.hist=[];S.pop=null;all();}catch(e){alert('Не получилось прочитать текст проекта.');}}
function popRoom(){
  let h=`<div class="row"><label>Название<input type="text" style="width:190px" value="${esc(CR.name)}" onchange="renRoom(${S.ri},this.value)"></label></div><div class="q">Сколько стен в комнате</div>${seg([1,2,3,4].map(k=>[k,k]),CR.n,v=>`setRN(${v})`)}<div class="hint">1 — прямая, 2 — буква Г, 3 — буква П, 4 — квадрат.</div><div class="q">Размеры стен</div>`;
  for(let i=0;i<CR.n;i++){const w=CR.w[i];h+=`<div class="row"><b>Стена ${i+1}</b><label>Длина, см<input type="number" value="${w.len}" onchange="uw(${i},'len',this.value)"></label><label>Высота, см<input type="number" value="${w.h}" onchange="uw(${i},'h',this.value)"></label></div>`;}
  h+=`<div class="q">Высоты по умолчанию (от пола, см)</div><div class="row">${TYPES.map(k=>`<label>${TS[k]}<input type="number" style="width:70px" value="${P.hd[k]}" onchange="P.hd['${k}']=num(this.value);all()"></label>`).join('')}</div><div class="row"><button onclick="openPop('panel')">▮ Настроить щиток</button></div>`;
  return {modal:true,title:'Комната: настройки',tabs:'',body:h};
}
function setRN(n){CR.n=n;S.cw=Math.min(S.cw,n-1);CR.p.w=Math.min(CR.p.w,n-1);all();}
function uw(i,k,v){const w=CR.w[i];w[k]=Math.max(10,num(v));if(k=='len'){if(!w.touched)respread(w);else w.b.forEach(b=>b.x=Math.min(b.x,w.len));}all();}

/* итоги */
function calc(rm){return withRoom(rm,()=>{
  const R=ring(),pw=CR.w[R.pw],tot={},js={},cnt={};let pipes=0,rb=0;
  const rows=R.all.slice().sort((a,b)=>R.br[a.b.id]!=R.br[b.b.id]?(R.br[a.b.id]>R.br[b.b.id]?1:-1):R.nm[a.b.id]-R.nm[b.b.id]).map(o=>{
    const b=o.b,w=CR.w[o.wi],pc=pcOf(b),len=Math.abs((w.h-30)-bh(b))+Math.abs(o.s-R.sp)+Math.abs((pw.h-30)-CR.p.h),pi=b.ts.includes('p')?pairInfo(b.id):null;
    pipes+=len*pc;
    if(isRd(R,b))rb++;else js[b.js]=(js[b.js]||0)+1;
    b.ts.forEach(t=>{cnt[t]=(cnt[t]||0)+1;WIRES[t].forEach(([c,s])=>{const k=c+'|'+s;tot[k]=(tot[k]||0)+len+15+50;});});
    return {lab:R.lab(b.id),b,wi:o.wi,pc,len,pi};});
  return {rm,R,rows,tot,js,cnt,rb,pipes};
});}
const GNn=g=>GN[g];
function refTable(){return `<table><tr><th>Тип</th><th>Провода</th><th>Что с чем</th></tr>${TYPES.map(t=>`<tr><td>${TN[t]}</td><td>${WIRES[t].map(([c])=>`<span class="sw" style="background:${WC[c]}"></span>${CN[c]}`).join('<br>')}<br><b>${WIRES[t].length} × ${fmt(WIRES[t][0][1])} мм²</b></td><td>${WHERE[t]}</td></tr>`).join('')}</table>`;}
function popTot(){
  const all1=S.ts=='all',D=(all1?P.rooms:[CR]).map(calc);
  const tab=S.tt,agg=(k)=>{const r={};D.forEach(d=>Object.keys(d[k]).forEach(x=>r[x]=(r[x]||0)+d[k][x]));return r;};
  let body='';
  if(tab=='pipes'){
    if(!all1){const d=D[0],R=d.R;
      if(!R.G)body='<div class="hint">В этой комнате пока нет коробок.</div>';
      else{
        body=`<table><tr><th>№</th><th>Что</th><th>Ст.</th><th>Выс.</th><th>Труб × м</th></tr>${d.rows.map(r=>`<tr><td>${r.lab}</td><td>${r.b.ts.length>1?GN[r.b.ts.length]+(r.b.or=='v'?' верт.':' гориз.')+': ':''}${r.b.ts.map(t=>TS[t]).join('+')}${r.pi?' «'+esc(r.pi.name)+'»':''}${r.b.name?' ('+esc(r.b.name)+')':''}</td><td>${r.wi+1}</td><td>${bh(r.b)}</td><td>${r.pc} × ${fmt((Math.round(r.len)/100).toFixed(2))}</td></tr>`).join('')}</table>`+
        `<div class="q">Трубы в щиток</div><table>${R.nA?`<tr><td>Пришло ${R.two?'слева':'с одной стороны'}</td><td><b>${R.nA} тр.</b></td></tr>`:''}${R.nB?`<tr><td>Пришло справа</td><td><b>${R.nB} тр.</b></td></tr>`:''}<tr><td>Всего у щитка (стена ${R.pw+1})</td><td><b>${R.N} тр.</b></td></tr></table>`;
        if(CR.n>1)body+=`<div class="q">Трубы на стыках стен</div><table>${withRoom(CR,()=>[...Array(CR.n-1).keys()].map(i=>`<tr><td>Стена ${i+1} → ${i+2}</td><td>${cntAt(R,R.cum[i+1])} тр.</td></tr>`).join(''))}</table>`;
      }
    }else body=`<table><tr><th>Комната</th><th>Мест</th><th>Труб у щитка</th><th>Труб, м</th></tr>${D.map(d=>`<tr><td>${esc(d.rm.name)}</td><td>${d.R.G}</td><td>${d.R.N}</td><td>${fmt((Math.ceil(d.pipes/10)/10).toFixed(1))}</td></tr>`).join('')}</table>`;
    body+=`<div class="note">Труб всего: ${fmt((Math.ceil(D.reduce((a,d)=>a+d.pipes,0)/10)/10).toFixed(1))} м.</div>`;
  }else if(tab=='wires'){
    const tot=agg('tot');
    body=`<table><tr><th>Цвет</th><th>Сечение</th><th>Метров</th></tr>${Object.keys(tot).sort().map(k=>{const [c,s]=k.split('|');return `<tr><td><span class="sw" style="background:${COL[c][1]}"></span>${COL[c][0]}</td><td>${fmt(s)} мм²</td><td>${fmt((Math.ceil(tot[k]*1.1/10)/10).toFixed(1))}</td></tr>`;}).join('')||'<tr><td colspan="3">Пока нет данных</td></tr>'}</table><div class="note">Провод на каждый элемент: длина трубы + 15 см в коробке + 50 см в щитке, запас 10%.</div>`;
  }else if(tab=='boxes'){
    const js=agg('js'),cnt=agg('cnt'),rb=D.reduce((a,d)=>a+d.rb,0);
    body=`<div class="q">Распределительные коробки</div><table>${Object.keys(js).map(k=>`<tr><td>${esc(k.replace('x','×'))}</td><td>${js[k]} шт.</td></tr>`).join('')}${rb?`<tr><td>круглые (по краям, одиночные)</td><td>${rb} шт.</td></tr>`:''}${!Object.keys(js).length&&!rb?'<tr><td colspan="2">Пока нет данных</td></tr>':''}</table>`+
    `<div class="q">Подрозетники (элементы)</div><table>${TYPES.filter(t=>cnt[t]).map(t=>`<tr><td>${TN[t]}</td><td>${cnt[t]} шт.</td></tr>`).join('')||'<tr><td colspan="2">Пока нет данных</td></tr>'}</table>`;
  }else body=refTable();
  const tabs=`<div class="tabs"><button class="${all1?'':'on'}" onclick="S.ts='room';all()">Эта комната</button><button class="${all1?'on':''}" onclick="S.ts='all';all()">Весь проект</button></div>`+tabsH([['pipes','Трубы'],['wires','Провода'],['boxes','Коробки'],['ref','Схемы']],tab,v=>`S.tt='${v}';all()`);
  return {modal:true,title:'📊 Итоги · '+(all1?esc(P.name):esc(CR.name)),tabs,body};
}

/* ---------- действия ---------- */
function all(){syncPairs();renderTop();renderDock();renderPop();draw3d();renderEmpty();save();}
function near(d){const o=curO();if(!o)return;const w=CR.w[o.wi],b=mkBox(clamp(o.b.x+d*50,0,w.len),'o');w.b.push(b);w.touched=true;S.pop={k:'box',id:b.id,tab:'comp'};all();}
function nudge(d){const o=curO();if(!o)return;o.b.x=clamp(o.b.x+d,0,CR.w[o.wi].len);CR.w[o.wi].touched=true;all();}
function nudgeP(d){CR.p.x=clamp(CR.p.x+d,0,CR.w[CR.p.w].len);all();}
function delBox(){const o=curO();if(!o)return;const w=CR.w[o.wi];w.b=w.b.filter(b=>b.id!=o.b.id);if(!w.touched)respread(w);S.pop=null;all();}
function et(k,v){const o=curO();if(!o)return;CR.w[o.wi].touched=true;o.b.ts[k]=v;if(k==0)o.b.hc=null;all();}
function eb(f,v){const o=curO();if(!o)return;const b=o.b,w=CR.w[o.wi];w.touched=true;
  if(f=='g'){const k=+v;while(b.ts.length<k)b.ts.push(b.ts[b.ts.length-1]);b.ts.length=k;b.pc=null;}
  else if(f=='pc'){b.pc=v===''?null:Math.max(1,Math.round(num(v)));}
  else if(f=='name'){b.name=v;const g=guess(v);if(g){b.ts[0]=g;b.hc=null;}}
  else if(f=='pos'){const p=clamp(num(v),0,w.len);b.x=b.fr=='R'?w.len-p:p;}
  else if(f=='hc'){b.hc=v===''?null:num(v);}
  else b[f]=v;
  all();}

/* ---------- жесты: вращение, щипок, тап ---------- */
const st=$('stage'),ptr=new Map();let pd=null,mv=false,pdist=0,zq=0;
const dist2=()=>{const a=[...ptr.values()];return a.length<2?0:Math.hypot(a[0][0]-a[1][0],a[0][1]-a[1][1]);};
const zsoft=()=>{if(!zq)zq=requestAnimationFrame(()=>{zq=0;draw3d();});};
st.addEventListener('pointerdown',e=>{if(e.target.closest('#zoom'))return;ptr.set(e.pointerId,[e.clientX,e.clientY]);if(ptr.size==1){pd=[e.clientX,e.clientY];mv=false;}else{pdist=dist2();mv=true;}});
st.addEventListener('pointermove',e=>{
  if(!ptr.has(e.pointerId))return;ptr.set(e.pointerId,[e.clientX,e.clientY]);
  if(ptr.size>=2){const nd=dist2();if(pdist>0){S.z=clamp(S.z*nd/pdist,.3,6);zsoft();}pdist=nd;return;}
  if(!pd)return;const dx=e.clientX-pd[0],dy=e.clientY-pd[1];if(!mv&&Math.hypot(dx,dy)<8)return;mv=true;S.vy+=dx*.4;S.vx=clamp(S.vx-dy*.4,-85,85);pd=[e.clientX,e.clientY];view();});
function endp(e,tap){
  const had=ptr.has(e.pointerId);ptr.delete(e.pointerId);
  if(had&&tap&&ptr.size==0&&pd&&!mv){const el=e.target.closest&&e.target.closest('[data-id],[data-pn]');
    if(el){if(el.dataset.pn)openPop('panel');else if(el.classList.contains('jb'))openWire(+el.dataset.id);else pick(+el.dataset.id);}}
  if(ptr.size==0){pd=null;pdist=0;}else if(ptr.size==1)pd=null;
}
st.addEventListener('pointerup',e=>endp(e,true));
st.addEventListener('pointercancel',e=>endp(e,false));
st.addEventListener('wheel',e=>{e.preventDefault();S.z=clamp(S.z*(e.deltaY<0?1.12:.89),.3,6);zsoft();},{passive:false});
$('zp').onclick=()=>{S.z=clamp(S.z*1.25,.3,6);draw3d();};
$('zm').onclick=()=>{S.z=clamp(S.z/1.25,.3,6);draw3d();};
$('zr').onclick=()=>{S.z=1;S.vx=-25;S.vy=-35;draw3d();};
window.addEventListener('resize',draw3d);
window.appBack=()=>{if(S.pop){closePop();return true;}return false;};
all();
</script></body></html>
